const input=document.getElementById('photo'), canvas=document.getElementById('result'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const make=document.getElementById('make'),send=document.getElementById('send'),status=document.getElementById('status');let chosen=null,ready=false;
poster.onload=()=>{ctx.drawImage(poster,0,0,canvas.width,canvas.height);};
input.addEventListener('change',()=>{const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('image/'))return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{chosen=im;ready=false;make.disabled=false;send.disabled=true;status.textContent='Foto selecionada. Toque em “Criar meu convite”.';URL.revokeObjectURL(url);};im.onerror=()=>{status.textContent='Não foi possível abrir essa foto. Tente outra.';};im.src=url;});
function cover(image){const scale=Math.max(canvas.width/image.width,canvas.height/image.height),w=image.width*scale,h=image.height*scale;ctx.drawImage(image,(canvas.width-w)/2,(canvas.height-h)/2,w,h);}
make.addEventListener('click',()=>{if(!chosen||!poster.complete)return;cover(chosen);const layer=document.createElement('canvas');layer.width=canvas.width;layer.height=canvas.height;const l=layer.getContext('2d',{willReadFrequently:true});l.drawImage(poster,0,0,layer.width,layer.height);const pixels=l.getImageData(0,0,layer.width,layer.height),d=pixels.data;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];const dominance=Math.min(g-r-28,g-b-22);if(dominance>0){d[i+3]=0;}else if(dominance>-18){d[i+3]=Math.round(255*(1-(dominance+18)/18));}}l.putImageData(pixels,0,0);ctx.drawImage(layer,0,0);ready=true;send.disabled=false;status.textContent='Convite criado! Confira a prévia e envie pelo WhatsApp.';});
async function blob(){return new Promise(resolve=>canvas.toBlob(resolve,'image/png'));}
send.addEventListener('click',async()=>{if(!ready)return;const b=await blob();if(!b){status.textContent='Não foi possível gerar a imagem.';return;}const file=new File([b],'convite-encontro-de-mulheres.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Meu convite — Encontro de Mulheres',text:'Meu convite personalizado!'});status.textContent='Compartilhamento aberto.';}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=file.name;a.click();window.open('https://wa.me/?text='+encodeURIComponent('Estou enviando meu convite personalizado para o Encontro de Mulheres!'),'_blank');status.textContent='Imagem baixada. Anexe o arquivo no WhatsApp para enviar.';}}catch(e){if(e.name!=='AbortError')status.textContent='Não foi possível abrir o compartilhamento. Tente novamente.';}});
</script></body></html>
